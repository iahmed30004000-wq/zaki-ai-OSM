# «مساعد الاتصال» — the Android call helper (apps/call-helper-android).
#
# This is the ONLY place its APK is built: nobody's machine has Java, Gradle
# or the Android SDK. It runs the JVM unit tests, then builds the release and
# debug APKs and keeps them as one artifact for 30 days.
#
# Signing: when the owner has added the four ANDROID_* secrets, the release APK
# is signed with his key. Until then it is built unsigned, and the debug APK
# (signed with this runner's throwaway debug key) is the one that installs.
# No key, password or alias is written in this repository.
name: Android call helper

on:
  pull_request:
    paths:
      - 'apps/call-helper-android/**'
      - '.github/workflows/android-call-helper.yml'
  push:
    branches: [main]
    paths:
      - 'apps/call-helper-android/**'
      - '.github/workflows/android-call-helper.yml'
  workflow_dispatch:

# Read-only: nothing here comments, pushes or releases.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/call-helper-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No wrapper jar is committed (it cannot be produced here), so Gradle
      # itself is pinned by version instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode the signing key (only when the secrets exist)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/call-helper.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease assembleDebug

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/call-helper.jks"

      - name: Summary
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          {
            echo "## مساعد الاتصال — APK"
            echo
            if [ "$SIGNED" = "yes" ]; then
              echo "نسخة release موقّعة بمفتاح المالك، ومعها نسخة debug."
            else
              echo "ما في أسرار توقيع (ANDROID_KEYSTORE_B64 …): نسخة release **غير موقّعة** وما بتنزل على الهاتف."
              echo "للتجربة نزّلي **app-debug.apk** (موقّعة بمفتاح debug مؤقت تبع هالتشغيل)."
            fi
            echo
            echo '| الملف | الحجم |'
            echo '|---|---|'
            find app/build/outputs/apk -name '*.apk' -printf '| %f | %s بايت |\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: call-helper-apk
          path: apps/call-helper-android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
