# The gate every PR passes before it is merged.
#
# It runs the four things a person would run by hand, in the order that
# fails cheapest first: types, lint, tests, then the production build.
#
# The build's environment mirrors the Dockerfile exactly (lines 36-37):
# `NODE_ENV=production` and the same placeholder `JWT_SECRET`. Next collects
# page data at build time, and some modules read the secret on import — so a
# build without one fails for a reason that has nothing to do with the
# change under review. The value is a placeholder and is never the one
# production runs with; production's comes from Coolify.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only. Nothing here comments, labels, pushes or releases, and a token
# that can only read cannot be talked into doing any of those by a pull
# request from a fork.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the input, and a
      # resolution that drifts between a developer's machine and this one
      # is a green CI over different code.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ── Right after the linter, and for the same reason ──
      #
      # This repository is public. A password written into a file here is
      # published the moment the commit is, and deleting the line later
      # does not unpublish it — the history keeps it. The demo password
      # that thirteen real accounts were still using got in exactly that
      # way, and sat in `prisma/seed.ts` and the README until somebody
      # went looking.
      #
      # It costs about a second and it reads only tracked files, so it
      # runs before the tests rather than after: a leaked credential is
      # not something to learn about four minutes later.
      - name: Secrets
        run: npm run scan:secrets

      # The suite reads a secret on import in a few places; the value is
      # irrelevant to every assertion and only has to exist.
      - name: Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-used-anywhere

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          JWT_SECRET: build-time-placeholder-secret-value

      # ── The payload budget, measured on the build that just happened ──
      #
      # `quality-gates.test.ts` holds a ratchet on the first-load
      # stylesheet. It reads `.next/static`, which does not exist while the
      # Tests step runs — so under that step it skipped silently, and a
      # ratchet was crossed with nobody told. A guard that is quiet because
      # it could not measure reads exactly like a guard that passed.
      #
      # The order above stays as it is: nobody should sit through a
      # production build to be told about a typo. So the files that need a
      # build run again here, after it — three of them now.
      #
      # REQUIRE_BUILD=1 turns the test's «no build, skip» into a FAILURE.
      # Without it — every local run — it still skips, so running the suite
      # never requires building first. The step also prints the measured
      # KB and the room left, so the number can be watched instead of only
      # being tripped over.
      #
      # ── AND THE THREE MEASURE THREE DIFFERENT THINGS ──
      #
      # `quality-gates.test.ts` — the DASHBOARD's first-load stylesheet.
      # Ninety-six kilobytes of Tailwind utilities and four palettes that
      # no public page loads: a management number, and a ratchet on it.
      #
      # `public-first-load.test.ts` — the PUBLIC entries, separately, which
      # is what D7 is actually about: `/s/[store]` and `/lp/[slug]`, their
      # JavaScript plus the stylesheet the shop inlines, gzipped, against a
      # measured ceiling. `AUDIT.md` §7.5 said «the public pages are a
      # different entry» and left it UNVERIFIED pending this step.
      #
      # `what-a-shopper-downloads.test.ts` — the framework floor and what a
      # customer's page is allowed to import. It has always needed a build
      # and was never in this step, so in CI it returned early, silently,
      # on every run: a guard that cannot measure reads exactly like one
      # that passed.
      - name: Payload budget
        run: npx vitest run src/lib/quality-gates.test.ts src/lib/public-first-load.test.ts src/lib/what-a-shopper-downloads.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-used-anywhere
          REQUIRE_BUILD: '1'
